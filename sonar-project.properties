# ============================================================================
#  AP_2 - Configuration du projet SonarQube
# ----------------------------------------------------------------------------
#  Ce fichier est lu par le SonarScanner depuis la RACINE du depot.
#  Il doit rester a la racine : le scanner ne descend pas dans AP_2/.
#
#  Perimetre analyse : le code de l'AP_1 (IaC) compile en ARM.
#  SonarQube Community Build analyse nativement :
#    - Azure Resource Manager (ARM JSON) ;
#    - les secrets (tous fichiers) ;
#    - mais PAS le Bicep brut, ni PowerShell, ni YAML.
#  D'ou l'etape de compilation Bicep -> build/arm/ dans le workflow.
# ============================================================================

sonar.projectKey=redone-ap1-iac
sonar.projectName=RedOne - AP_1 Infrastructure as Code
sonar.projectVersion=1.0

# Sources analysees : le code AP_1 + les templates ARM generes.
sonar.sources=AP_1,build/arm

# Fichiers non pertinents pour l'analyse.
sonar.exclusions=**/*.odt,**/*.png,**/*.jpg,**/*.jpeg,**/*.svg,**/*.zip,**/*.lock,**/node_modules/**

sonar.sourceEncoding=UTF-8

# Bloque le job si la Quality Gate echoue.
sonar.qualitygate.wait=true
